name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gymos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gymos_test?schema=public
      JWT_SECRET: ci-jwt-secret-at-least-32-characters-long
      CORS_ORIGIN: http://localhost:3000
      BCRYPT_ROUNDS: "1"
      JWT_ACCESS_TTL: 15m
      JWT_REFRESH_TTL_DAYS: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma migrate deploy
        run: pnpm --filter api exec prisma migrate deploy

      # Build may regenerate Prisma Client; concurrent Jest/typecheck can import
      # its temporarily missing #main-entry-point. Serialize these tasks to
      # eliminate this nondeterministic CI-only race without touching runtime.
      - name: Lint, typecheck, test, e2e, build (serialized Prisma client)
        run: pnpm exec turbo run lint typecheck test test:e2e build --filter=api --concurrency=1

      # Read-only external smoke against the *isolated* release-rehearsal API.
      # This job cannot create accounts, change prices or send messages.
      - name: ARES PR5 rehearsal public HTTP and auth boundary smoke
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/ares-ops-payments-and-memberships-20261028'
        run: node apps/api/scripts/smoke-ares-rehearsal-public.mjs

      # Pure Node env-precedence + release-contract unit tests (no Expo CLI).
      - name: Mobile env precedence tests
        run: pnpm --filter mobile test:env

      # Real Expo config pathway (EXPO_NO_DOTENV=1). Loads env/.env.ares when present,
      # otherwise the checked-in env/.env.ares.example production contract (CI).
      - name: Mobile ARES config verify
        run: pnpm --filter mobile config:verify:ares
